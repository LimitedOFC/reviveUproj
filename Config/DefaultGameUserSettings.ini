; Simple Edit — one-click open+confirm. Implies EditOnRelease + ConfirmEditOnRelease.
bSimpleEdit=False

; Edit On Release — confirm the shape automatically when the edit key is released.
bEditOnRelease=False

; Confirm Edit On Release — confirm fires on key-up instead of key-down (Builder Pro).
bConfirmEditOnRelease=False

; Reset On Release — reset to full shape on release when no cell was selected.
bResetOnRelease=False

; Disable Pre-Edits — always start from the full piece shape, never carry over last edit.
bDisablePreEdits=False

; Turbobuild — hold fire in build mode to auto-place pieces continuously.
bTurbobuild=True

; Builder Pro Support — separate piece binds, hold-to-open edit, separate confirm bind.
bBuilderProSupport=False

; Simple Edit Support — allow Simple Edit to be toggled from a runtime keybind.
bSimpleEditSupport=True

; Instant Edit Toggle — skip the open-edit animation and enter edit mode immediately.
bInstantEditToggle=True

; Edit Hold Time — seconds to hold edit key before cursor opens (Builder Pro only). Range 0.0–0.5.
EditHoldTime=0.000000

; Edit Reset Delay — minimum seconds after a confirm before reset-on-release can fire. Range 0.0–1.0.
EditResetDelay=0.150000
